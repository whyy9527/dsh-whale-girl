[project]
name = "dsh-whale-girl"
version = "0.1.0"
description = "A macOS screen companion powered by DSH and local Qwen TTS"
requires-python = "==3.13.*"
dependencies = [
  "numpy==2.5.4",
  "pillow==13.0.0",
  "requests==2.34.2",
  "pyobjc-framework-Cocoa==13.0",
  "pyobjc-framework-Quartz==13.0",
  "pyobjc-framework-ApplicationServices==13.0",
]

[project.optional-dependencies]
tts = ["mlx-audio==0.5.0"]

[tool.uv]
package = false
